[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-lora-finetune"
version = "0.1.0"
description = "LoRA fine-tuning of a small LLM for tool calling, scored on a held-out agent benchmark"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.2", "transformers>=4.45", "peft>=0.12", "accelerate>=0.33"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
