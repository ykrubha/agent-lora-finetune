name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: git clone https://github.com/ykrubha/agentic-data-analyst.git agent
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e agent -e ".[dev,train]" jinja2
      - run: pytest -q
